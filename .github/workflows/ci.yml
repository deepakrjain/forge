name: Forge CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: forge_db
          POSTGRES_USER: forge_user
          POSTGRES_PASSWORD: forge_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge_user -d forge_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          cd shared && pip install -e . && cd ..
          pip install -r api/requirements.txt
          pip install -r worker/requirements.txt

      - name: Run Worker Unit Tests
        run: |
          cd worker
          python -m pytest tests/unit -v

      - name: Run API Unit Tests
        run: |
          cd api
          python -m pytest tests/unit -v

      - name: Run Integration Tests
        env:
          POSTGRES_URI: postgresql+asyncpg://forge_user:forge_password@localhost:5432/forge_db
          REDIS_URI: redis://localhost:6379/0
        run: |
          python -m pytest tests/integration -v

  build:
    name: Build Docker Images
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api/Dockerfile
          push: false
          tags: forge-api:latest

      - name: Build Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: worker/Dockerfile
          push: false
          tags: forge-worker:latest

      - name: Build Dashboard Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dashboard/Dockerfile
          push: false
          tags: forge-dashboard:latest
